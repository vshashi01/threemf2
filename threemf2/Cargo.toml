[package]
name = "threemf2"
version = "0.4.1"
rust-version = "1.89"
edition = "2024"
license = "MIT or Apache-2.0"

description = "3MF (3D Manufacturing Format) file format support"
keywords = ["3MF", "CAD", "slicer", "triangle", "mesh"]
categories = ["encoding", "rendering::data-formats"]

homepage = "https://github.com/vshashi01/threemf2"
repository = "https://github.com/vshashi01/threemf2"
readme.workspace = true

[features]
default = [
    "package-write",
    "package-read",
    "package-lazy-read",
    "write",
    "read",
]
write = ["dep:instant-xml"]
read = ["dep:instant-xml"]
package-write = ["dep:zip", "write"]
package-read = ["dep:zip", "read"]
package-lazy-read = ["dep:once_cell", "package-read"]
uuid = ["dep:uuid"]

[dependencies]
# instant-xml = { version = "0.7.6", optional = true }
instant-xml = { version = "0.7.7", optional = true, path = "../../../instant-xml/instant-xml/instant-xml" }
thiserror = { version = "2.0.20" }
zip = { version = "8.6.0", default-features = false, features = [
    "deflate",
], optional = true }
once_cell = { version = "1.21.4", optional = true }
lexical-core = { version = "1.0.6" }
uuid = { version = "1.24.1", optional = true }
compact_str = { version = "0.10.0", features = ["serde"] }


[dev-dependencies]
pretty_assertions = { version = "1.4.1" }
serde-roxmltree = { version = "0.11.3" }


[[example]]
name = "write"
path = "examples/write.rs"
required-features = ["package-write"]

[[example]]
name = "unpack"
path = "examples/unpack.rs"
required-features = ["package-lazy-read"]

[[example]]
name = "package_read"
path = "examples/package_read.rs"
required-features = ["package-read"]

[[example]]
name = "beamlattice_write"
path = "examples/beamlattice_write.rs"
required-features = ["package-write"]

[[example]]
name = "string_extraction"
path = "examples/string_extraction.rs"
required-features = ["package-lazy-read"]

[[example]]
name = "builder_example"
path = "examples/builder_example.rs"
required-features = ["package-write"]

[[example]]
name = "builder_beamlattice_example"
path = "examples/builder_beamlattice_example.rs"
required-features = ["package-write"]

[[example]]
name = "query_example"
path = "examples/query_example.rs"
required-features = ["package-read", "uuid"]

[[example]]
name = "boolean_write"
path = "examples/boolean_write.rs"
required-features = ["package-write"]

[[example]]
name = "slice_write"
path = "examples/slice_write.rs"
required-features = ["package-write"]


[package.metadata.cargo-all-features]
max_combination_size = 3
always_include_features = ["write"]
