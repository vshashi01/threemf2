[package]
name = "threemf2-benches"
version = "0.1.0"
rust-version = "1.89"
edition = "2024"
license = "MIT or Apache-2.0"
publish = false

[dependencies]
instant-xml = { version = "0.7.6" }
threemf2 = { path = "../threemf2", features = [
    "package-read",
    "package-write",
] }
lib3mf-core = { version = "0.4.0", features = ["parallel"] }
lib3mf = { version = "0.1.6", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dhat = "0.3.3"

[features]
default = []
uuid = ["threemf2/uuid"]
enable-alloc-check = []
benchmark-all = []
any = ["threemf2/any"]

[[bench]]
name = "reader"
harness = false

[[bench]]
name = "threemf_reader_multi"
harness = false

[[bench]]
name = "threemf_reader_slices"
harness = false


[[bench]]
name = "threemf_writer"
harness = false
